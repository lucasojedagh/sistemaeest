# =============================================================================
# nginx FRONTE-PLUS-FRENTE del despliegue institucional (docker-compose).
#
# PRODUCCIÓN INSTITUCIONAL: un solo origen (este server, puerto 80 del
# contenedor, publicado en http://<host-de-la-institucion>:8000) sirve las DOS
# aplicaciones, y así el frontend se publica en la red del colegio sin depender
# de http://localhost:8000:
#
#   1) BACKEND Laravel (PHP-FPM en backend:9000, root /var/www/public)
#        /api/...                 -> toda la API JSON (routes/api.php, que el
#                                    RouteServiceProvider monta con prefijo "api")
#        /print/..., /calificaciones/planilla*, /horarios/planilla
#                                 -> los "imprimibles" de routes/web.php: el
#                                    navegador/iframe los abre DIRECTO, no pasan
#                                    por /api, por eso también van al PHP.
#        /storage/...             -> archivos subidos (documentos, fotos)
#        /sanctum/...             -> csrf de Sanctum (auth por cookie, si se usa)
#
#   2) FRONTEND React compilaDO (contenedor "frontend", puerto 80)
#        el resto: /, /login, /alumnos, /dashboard, /EscudoENRO.png ...
#        Las rutas del SPA no son archivos; el fallback a index.html
#        (`try_files $uri $uri/ /index.html`) vive en el nginx interno de ese
#        contenedor (ver docker/frontend/Dockerfile), así que acá alcanza con
#        reenviarle lo que no es backend.
#
# Con este armado el build del frontend usa VITE_API_BASE=/api (ver
# frontend/.env.example y el build.args del servicio frontend en
# docker-compose.yml): la app pide la API al mismo host que le sirve la página,
# no hay CORS que configurar y no queda localhost quemado en el bundle.
#
# Directivas pensadas para la institución (no para el dev de cada día):
#   - server_name _     -> responde por IP interna o por nombre (los dos).
#   - client_max_body_size 64M -> suba de documentos; debe coincidir con
#     post_max_size/upload_max_filesize del PHP (docker/backend/uploads.ini).
#   - Cache-Control en /assets/ (1 año, immutable) y no-cache en index.html
#     -> los navegadores de la escuela no quedan con una versión vieja del sistema.
# Para desarrollo seguís usando `php artisan serve` (:8000) + `npm run dev`
# (:5173) sin nginx: api.js toma el default http://localhost:8000/api.
# =============================================================================

server {
    listen 80;
    # En la red del colegio se entra por IP fija o por nombre DNS: "_" cubre
    # cualquier host. Si el depto. de sistemas define un dominio, ponerlo acá.
    server_name _;
    client_max_body_size 64M;

    # Raíz del BACKEND. Las rutas del SPA NO se buscan acá: se reenvían al
    # contenedor frontend (bloque `location /`).
    root /var/www/public;

    add_header X-Content-Type-Options "nosniff";

    # Compresión: achica ~70% el JSON de la API y el JS/CSS.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain application/pdf;
    gzip_proxied any;

    index index.php;

    charset utf-8;

    # ---------------------------------------------------------------------
    # 1) BACKEND LARAVEL (todo esto sigue resuelto por PHP-FPM, como antes)
    # ---------------------------------------------------------------------

    # API JSON. Prefijo: gana sobre `location /` (SPA) por coincidencia más larga.
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Imprimibles (routes/web.php). Se listan EXACTOS porque el SPA también tiene
    # una ruta propia /calificaciones (pantalla de notas): si se usara el prefijo
    # /calificaciones, la página React dejaría de abrir.
    location = /calificaciones/planilla         { try_files $uri $uri/ /index.php?$query_string; }
    location = /calificaciones/planilla/excel   { try_files $uri $uri/ /index.php?$query_string; }
    location = /calificaciones/planilla/guardar { try_files $uri $uri/ /index.php?$query_string; }
    location = /horarios/planilla               { try_files $uri $uri/ /index.php?$query_string; }

    # Listado de alumnos / asistencia del día (los abre window.open).
    location /print/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos que sube el backend (storage:app/public enlazado en public/storage).
    # Si el archivo existe se sirve directo; si no, lo resuelve Laravel (permisos).
    location /storage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum (login por cookie). Innofensivo hoy, que usa token Bearer.
    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---------------------------------------------------------------------
    # 2) FRONTEND COMPILADO (contenedor "frontend":80)
    # ---------------------------------------------------------------------

    # JS/CSS del build de Vite: el nombre de archivo lleva hash de contenido
    # (index-a1b2c3.js), así que se pueden cachear 1 año; cambiar de versión
    # genera otro nombre, nunca queda código viejo mezclado.
    # ^~ es OBLIGATORIO: sin él, el bloque regex ~* \.(css|js)$ de abajo gana y
    # busca los assets en la raíz del backend, donde no existen => 404.
    location ^~ /assets/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Todo lo demás es del SPA: index.html, /EscudoENRO.png y las rutas de
    # React Router (el contenedor frontend hace el fallback a index.html).
    location / {
        proxy_pass http://frontend;
        # Host/Proto reales: Laravel y el reset de contraseña arman URLs con esto.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El HTML del SPA se pide en cada entrada: index.html manda la versión
        # actual de los assets.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Archivos estáticos del BACKEND (public/css, etc.) sin cache: son los que
    # cambian con cada deploy de Laravel. No toca /assets/ (ver ^~ de arriba).
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
