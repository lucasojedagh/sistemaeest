[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531
; Desarrollo con código montado por volumen: validar cambios cada 2s.
; En producción poner validate_timestamps=0 + revalidate_freq=0 y reiniciar
; php-fpm en cada deploy.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1