upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Sin esto la imagen usa los 128 M de PHP por defecto. Medido con la base del
; colegio (1202 alumnos): el padrón de Excel llega a 76 M y restaurar un .sql del
; tamaño máximo que acepta la pantalla (50 MB) llega a 176 M -> error fatal y la
; base queda a mitad de camino.
memory_limit = 256M

; La imagen trae 30 s por pedido y nginx 60 s de espera (fastcgi_read_timeout):
; una restauración o una importación masiva de alumnos se corta antes de terminar.
; Mismo criterio que request_terminate_timeout del pool (docker/backend/php-fpm-pool.conf).
max_execution_time = 300
max_input_time = 300